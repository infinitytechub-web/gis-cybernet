name: Date & DoB Format Regression

# Guards the DD/MM/YYYY standard: unit tests, static scan of source renders,
# and a browser pass over key screens/exports. Runs on every build and PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: date-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + static scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Date format unit & consistency tests
        run: bun run test:dates

  browser:
    name: Rendered dates (screens, exports, print)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Date format smoke spec
        env:
          CI: "true"
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: bun run test:dates:smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-format-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
