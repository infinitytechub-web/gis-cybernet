    <!-- Security headers are enforced at the HTTP layer (see public/_headers,
         vercel.json, deploy/nginx-security-headers.conf). The meta-tag CSP
         was removed because in some preview/embed contexts it interfered
         with the login flow (auth + edge-function calls). HTTP-header CSP
         remains the source of truth in production. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" />
