# nginx security headers — drop into a `server { ... }` or `location / { ... }` block.
# Mirrors the policy in public/_headers and vercel.json so behaviour is consistent
# regardless of which host serves the SPA.
#
# Usage (Debian/Ubuntu):
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/cybernet-security.conf
#   then in your site config:
#     include /etc/nginx/snippets/cybernet-security.conf;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; script-src-elem 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https://ebndffutyrgybsduvijo.supabase.co wss://ebndffutyrgybsduvijo.supabase.co https://nominatim.openstreetmap.org https://api.qrserver.com https://server.arcgisonline.com https://*.tile.openstreetmap.org https://hooks.slack.com; frame-src 'self' https://view.officeapps.live.com; upgrade-insecure-requests" always;
add_header X-Frame-Options                "SAMEORIGIN" always;
add_header X-Content-Type-Options         "nosniff" always;
add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security      "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy             "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;
add_header Cross-Origin-Opener-Policy     "same-origin" always;
add_header Cross-Origin-Resource-Policy   "same-site" always;
add_header X-DNS-Prefetch-Control         "off" always;
